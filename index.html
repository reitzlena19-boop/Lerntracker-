<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mein Lerntracker</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --primary: #4a90e2;
      --primary-hover: #357abd;
      --accent: #ff9f43;
      --text-color: #2c3e50;
      --border-color: #e2e8f0;
      --danger: #e74c3c;
      --success: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      max-width: 1000px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Auth Screen */
    .auth-card {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      max-width: 400px;
      margin: 40px auto;
      width: 100%;
      text-align: center;
    }

    .auth-card h2 {
      margin-bottom: 20px;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
      font-size: 0.9em;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 1em;
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .auth-buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .auth-buttons button {
      flex: 1;
    }

    .btn-secondary {
      background-color: #95a5a6;
    }
    .btn-secondary:hover {
      background-color: #7f8c8d;
    }

    /* Header & Navigation */
    header {
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Main Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card h3 {
      margin-bottom: 15px;
      color: var(--primary);
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 8px;
    }

    /* Dragon Pet Section */
    .pet-container {
      text-align: center;
    }

    .pet-avatar {
      font-size: 4rem;
      margin: 15px 0;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .progress-bar-bg {
      background: #e0e0e0;
      border-radius: 10px;
      height: 15px;
      width: 100%;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Timer Section */
    .timer-display {
      font-size: 3rem;
      font-weight: bold;
      text-align: center;
      margin: 15px 0;
      font-family: monospace;
      color: var(--text-color);
    }

    .timer-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    /* Ranking List */
    .ranking-list {
      list-style: none;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .ranking-item:first-child {
      font-weight: bold;
      background-color: #fff9e6;
      border-radius: 6px;
    }

    /* Grades & Subjects */
    .subject-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .subject-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      background: #f8fafc;
      border-radius: 6px;
    }

    .hidden {
      display: none !important;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.85em;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="app-container">

    <!-- LOGIN / REGISTRIERUNG SCREEN -->
    <div id="authSection" class="auth-card">
      <h2>Lerntracker Login</h2>
      <div class="form-group">
        <label for="authEmail">E-Mail Adresse</label>
        <input type="email" id="authEmail" placeholder="deine@email.de">
      </div>
      <div class="form-group">
        <label for="authPassword">Passwort</label>
        <input type="password" id="authPassword" placeholder="••••••••">
      </div>
      <div class="form-group">
        <label for="authUsername">Benutzername (für Registrierung)</label>
        <input type="text" id="authUsername" placeholder="z.B. Alex">
      </div>
      <div class="auth-buttons">
        <button id="btnLogin">Anmelden</button>
        <button id="btnRegister" class="btn-secondary">Registrieren</button>
      </div>
      <p id="authError" class="error-msg"></p>
    </div>

    <!-- DASHBOARD (Nur sichtbar nach Login) -->
    <div id="dashboardSection" class="hidden">
      
      <header>
        <h1>🐉 Mein Lerntracker</h1>
        <div class="user-info">
          <span id="displayUsername">Hallo, Nutzer!</span>
          <button id="btnLogout" class="btn-secondary">Abmelden</button>
        </div>
      </header>

      <div class="dashboard-grid">

        <!-- LERNTIMER -->
        <div class="card">
          <h3>⏱️ Lerntimer</h3>
          <div class="timer-display" id="timerDisplay">25:00</div>
          <div class="timer-controls">
            <button id="btnStartTimer">Start</button>
            <button id="btnPauseTimer" class="btn-secondary">Pause</button>
            <button id="btnResetTimer" class="btn-secondary">Reset</button>
          </div>
          <div style="margin-top: 15px;">
            <label style="font-size: 0.9em; font-weight: 600;">Lernfach:</label>
            <input type="text" id="subjectInput" placeholder="z. B. Mathe" style="width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px;">
          </div>
        </div>

        <!-- DRACHEN PET (Gamification) -->
        <div class="card pet-container">
          <h3>🐲 Drachen-Begleiter</h3>
          <div class="pet-avatar" id="petAvatar">🥚</div>
          <p><strong id="petStage">Drachen-Ei</strong></p>
          <p style="font-size: 0.9em; color: #666; margin-top: 5px;">Gesamte Lernzeit: <span id="totalLearnTime">0</span> Min.</p>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="petProgress"></div>
          </div>
          <p style="font-size: 0.8em; margin-top: 5px; color: #888;">Nächstes Level in: <span id="nextLevelMinutes">30</span> Min.</p>
        </div>

        <!-- COMMUNITY RANKING (Realtime Cloud Sync) -->
        <div class="card">
          <h3>🏆 Community Leaderboard</h3>
          <ul class="ranking-list" id="rankingList">
            <li class="ranking-item"><span>Lade Ranking...</span></li>
          </ul>
        </div>

        <!-- NOTENRECHNER -->
        <div class="card">
          <h3>📊 Fächer & Noten</h3>
          <div style="display: flex; gap: 8px; margin-bottom: 12px;">
            <input type="text" id="newSubjectName" placeholder="Fachname" style="flex:2; padding:6px; border:1px solid #ccc; border-radius:4px;">
            <input type="number" id="newSubjectGrade" placeholder="Note" step="0.1" min="1" max="6" style="flex:1; padding:6px; border:1px solid #ccc; border-radius:4px;">
            <button id="btnAddSubject">+</button>
          </div>
          <div class="subject-list" id="subjectList"></div>
          <p style="margin-top: 15px; font-weight: bold;">Notendurchschnitt: <span id="averageGrade">-</span></p>
        </div>

      </div>
    </div>

  </div>

  <!-- FIREBASE MODULE & CONFIGURATION -->

    const app = initializeApp(firebaseConfig);

  <!-- Hauptskript -->
  <script src="script.js"></script>
</body>
</html>
